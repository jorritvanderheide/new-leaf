# Self-hosting New Leaf with Docker, no domain or web server of your own:
# the editor on your tailnet and the share links public, both at
# https://cv.<your tailnet>.ts.net, served by a tailscale container that
# New Leaf shares its network with.
#
#   1. In the Tailscale admin console, make an auth key, and allow Funnel
#      for this machine (the "funnel" node attribute in the tailnet policy).
#   2. In a .env file next to this one, set
#        TS_AUTHKEY=tskey-auth-...
#        NEW_LEAF_PUBLIC_URL=https://cv.<your tailnet>.ts.net
#      and optionally NEW_LEAF_USERS (CVs that always exist, by tailnet login)
#      or any other NEW_LEAF_* setting (see new-leaf serve -h).
#   3. docker compose up -d
#
# The editor is then at https://cv.<your tailnet>.ts.net:8443 (tailnet only),
# share links at https://cv.<your tailnet>.ts.net/<link>/ (public).
# Everything New Leaf keeps is in the new-leaf volume.

services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: cv
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  new-leaf:
    image: ghcr.io/jorritvanderheide/new-leaf:latest
    # Shares tailscale's network: tailscale serve reaches New Leaf on
    # 127.0.0.1, and New Leaf asks tailscale who each visitor is.
    network_mode: service:tailscale
    depends_on: [tailscale]
    environment:
      NEW_LEAF_PUBLIC_URL: ${NEW_LEAF_PUBLIC_URL:?set NEW_LEAF_PUBLIC_URL in .env}
      NEW_LEAF_USERS: ${NEW_LEAF_USERS:-}
    volumes:
      - new-leaf:/data
      - tailscale-socket:/var/run/tailscale
    restart: unless-stopped

volumes:
  tailscale:
  tailscale-socket:
  new-leaf:
