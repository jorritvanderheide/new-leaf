# On a version tag (1.2.3, matching the version in nix/package.nix):
# archives for Linux, macOS and Windows with typst included, a draft GitHub
# release with them and their checksums, and the container image on
# ghcr.io for amd64 and arm64, built with Nix. The archives and the image
# get a build provenance attestation.
name: Release

on:
  push:
    tags: ["[0-9]*"]

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: scripts/release.sh "$GITHUB_REF_NAME" dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Before 1.0, and tags like 1.2.0-rc.1, are pre-releases.
          prerelease=()
          case "$GITHUB_REF_NAME" in 0.*|*-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --verify-tag --draft "${prerelease[@]}" --title "New Leaf $GITHUB_REF_NAME" --generate-notes

  image:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Tag matches the package version
        run: |
          want="$(nix eval --raw .#default.version)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then echo "tag $GITHUB_REF_NAME, package $want"; exit 1; fi
      - name: Build
        run: nix build .#docker
      - name: Push
        env:
          CREDS: ${{ github.actor }}:${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          nix run nixpkgs#skopeo -- copy --dest-creds "$CREDS" \
            docker-archive:result "docker://$image:$GITHUB_REF_NAME-$ARCH"

  # One tag for both architectures, and latest, attested.
  manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Manifest
        id: manifest
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx imagetools create -t "$image:$GITHUB_REF_NAME" -t "$image:latest" \
            "$image:$GITHUB_REF_NAME-amd64" "$image:$GITHUB_REF_NAME-arm64"
          digest=$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
