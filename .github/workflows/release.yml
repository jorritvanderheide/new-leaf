# On a version tag (v1.2.3, matching the version in nix/package.nix):
# archives for Linux, macOS and Windows with typst included, a GitHub
# release with them and their checksums, and the container image on
# ghcr.io for amd64 and arm64, built with Nix.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: scripts/release.sh "$GITHUB_REF_NAME" dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --verify-tag --title "cv-app $GITHUB_REF_NAME" --generate-notes

  image:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Tag matches the package version
        run: |
          want="v$(nix eval --raw .#default.version)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then echo "tag $GITHUB_REF_NAME, package $want"; exit 1; fi
      - name: Build
        run: nix build .#docker
      - name: Push
        env:
          CREDS: ${{ github.actor }}:${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          nix run nixpkgs#skopeo -- copy --dest-creds "$CREDS" \
            docker-archive:result "docker://$image:$GITHUB_REF_NAME-$ARCH"

  # One tag for both architectures, and latest.
  manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Manifest
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx imagetools create -t "$image:$GITHUB_REF_NAME" -t "$image:latest" \
            "$image:$GITHUB_REF_NAME-amd64" "$image:$GITHUB_REF_NAME-arm64"
