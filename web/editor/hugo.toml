# The editor UI: static pages that talk to the cv-app JSON API. Built once,
# at package build time, and served by cv-app itself.
baseURL = "/"
title = "CV"
disableKinds = ["taxonomy", "term", "rss", "sitemap", "robotstxt", "404"]
enableGitInfo = false

[menus]
[[menus.main]]
name = "Compose"
pageRef = "/"
weight = 1
[[menus.main]]
name = "Items"
pageRef = "/items"
weight = 2
[[menus.main]]
name = "Profile"
pageRef = "/profile"
weight = 3
[[menus.main]]
name = "Links"
pageRef = "/links"
weight = 4
