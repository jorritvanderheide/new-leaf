{{ define "main" }}
  <div x-data="compose" x-effect="lang, photo, spacing, selected.join(), changed()" @resize.window="resized()" class="grid gap-6 lg:grid-cols-[22rem_1fr]">
    {{/* Selection */}}
    <aside class="space-y-4">
      <template x-if="editing">
        <div class="card flex items-center justify-between gap-3 px-4 py-3 text-sm">
          <div class="min-w-0">
            <p class="text-xs text-stone-500">Editing link</p>
            <p class="truncate font-medium" x-text="editing.label || editing.slug"></p>
          </div>
          <a href="/" class="btn">Done</a>
        </div>
      </template>

      <div class="card space-y-4 p-4">
        <div class="flex items-center justify-between">
          <span class="label mb-0">Language</span>
          <div class="seg">
            <template x-for="l in $store.cv.state.langs" :key="l">
              <button type="button" :aria-pressed="lang === l" @click="lang = l" x-text="l.toUpperCase()"></button>
            </template>
          </div>
        </div>
        <label class="flex items-center justify-between text-sm" :class="!$store.cv.state.profile.photo && 'opacity-50'">
          <span class="label mb-0">Photo</span>
          <input type="checkbox" class="size-4 accent-accent" x-model="photo" :disabled="!$store.cv.state.profile.photo">
        </label>
        <div>
          <div class="flex items-center justify-between">
            <label class="label mb-0" for="spacing">Spacing</label>
            <button type="button" class="text-xs text-stone-500 hover:text-stone-900" x-show="spacing !== 1" @click="spacing = 1">Reset</button>
          </div>
          <input id="spacing" type="range" min="0.4" max="1.4" step="0.05" class="mt-2 w-full accent-accent" x-model.number="spacing">
          <div class="flex justify-between text-[0.7rem] text-stone-400">
            <span>Tight</span><span x-text="Math.round(spacing * 100) + '%'"></span><span>Airy</span>
          </div>
        </div>
      </div>

      <template x-for="section in $store.cv.sections()" :key="section">
        <div class="card p-4" x-show="$store.cv.items(section).length">
          <div class="mb-2 flex items-center justify-between">
            <h2 class="text-xs font-semibold tracking-wide text-accent uppercase" x-text="$store.cv.sectionName(section)"></h2>
            <button
              type="button"
              class="text-xs text-stone-500 hover:text-stone-900"
              @click="toggleSection(section, sectionState(section) !== 'all')"
              x-text="sectionState(section) === 'all' ? 'None' : 'All'"></button>
          </div>
          <ul class="-mx-2 space-y-0.5">
            <template x-for="item in $store.cv.items(section)" :key="$store.cv.key(item)">
              <li>
                <label class="flex cursor-pointer gap-3 rounded-lg px-2 py-1.5 hover:bg-stone-50">
                  <input type="checkbox" class="mt-0.5 size-4 shrink-0 accent-accent" :value="$store.cv.key(item)" x-model="selected">
                  <span class="min-w-0 text-sm">
                    <span class="block truncate font-medium text-stone-900" x-text="$store.cv.text(item, lang).title"></span>
                    <span class="block truncate text-xs text-stone-500" x-text="[$store.cv.text(item, lang).org, $store.cv.period(item)].filter(Boolean).join(' · ')"></span>
                  </span>
                </label>
              </li>
            </template>
          </ul>
        </div>
      </template>

      <template x-if="!$store.cv.state.items.length">
        <div class="card p-6 text-center text-sm text-stone-500">
          Your CV is empty. <a href="/items/" class="font-medium text-accent">Add items</a> to get started.
        </div>
      </template>
    </aside>

    {{/* Preview */}}
    <section class="min-w-0 space-y-3">
      <div class="flex flex-wrap items-center gap-3">
        <span
          class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-sm font-medium"
          :class="pages > 2 ? 'bg-red-100 text-red-800' : pages === 2 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'"
          x-show="pages">
          <svg class="size-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M4 2.75A1.75 1.75 0 0 1 5.75 1h5.69c.46 0 .9.18 1.23.51l3.07 3.07c.33.33.51.77.51 1.23v10.44A1.75 1.75 0 0 1 14.5 18H5.75A1.75 1.75 0 0 1 4 16.25V2.75Z"/></svg>
          <span x-text="pages === 1 ? '1 page' : pages + ' pages'"></span>
        </span>
        <span class="text-xs text-stone-400" x-show="loading">Rendering…</span>
        <div class="ml-auto flex gap-2">
          <a class="btn" :href="pdfUrl || null" :download="filename()" :class="!pdfUrl && 'pointer-events-none opacity-50'">Download PDF</a>
          <button type="button" class="btn btn-primary" @click="openShare()" :disabled="!selected.length" x-text="editing ? 'Update link' : 'Share link'"></button>
        </div>
      </div>
      <div class="h-[calc(100vh-11rem)] min-h-[32rem] overflow-y-auto rounded-2xl bg-stone-200/70 p-4 ring-1 ring-stone-200 sm:p-6">
        <div
          x-ref="pages"
          role="img"
          aria-label="PDF preview"
          class="mx-auto max-w-3xl space-y-4 transition-opacity sm:space-y-6"
          :class="loading && 'opacity-60'"></div>
      </div>
    </section>

    {{/* Share dialog */}}
    <div x-cloak x-show="share.open" class="fixed inset-0 z-40 grid place-items-center bg-stone-900/40 p-4" @keydown.escape.window="share.open = false">
      <form class="card w-full max-w-md space-y-4 p-6" @submit.prevent="saveLink()" @click.outside="share.open = false">
        <template x-if="!share.result">
          <div class="space-y-4">
            <div>
              <h2 class="text-base font-semibold" x-text="editing ? 'Update share link' : 'New share link'"></h2>
              <p class="mt-1 text-sm text-stone-500">
                Publishes the <span x-text="selected.length"></span> selected items in
                <span x-text="$store.cv.langName(lang)"></span>, with a PDF download.
              </p>
            </div>
            <div x-show="!editing">
              <label class="label" for="share-label">Label</label>
              <input id="share-label" class="input" x-model="share.label" placeholder="e.g. uva" maxlength="40">
              <p class="mt-1 text-xs text-stone-500">Shown in the URL, followed by a random code so it can't be guessed.</p>
            </div>
            <div>
              <label class="label" for="share-expires">Expires on</label>
              <input id="share-expires" type="date" class="input" x-model="share.expires" :min="$store.cv.state.today" required>
              <p class="mt-1 text-xs text-stone-500">The link stops working at the start of this day.</p>
            </div>
            <div class="flex justify-end gap-2">
              <button type="button" class="btn" @click="share.open = false">Cancel</button>
              <button class="btn btn-primary" :disabled="$store.cv.busy" x-text="$store.cv.busy ? 'Publishing…' : (editing ? 'Update' : 'Create link')"></button>
            </div>
          </div>
        </template>
        <template x-if="share.result">
          <div class="space-y-4">
            <h2 class="text-base font-semibold">Link ready</h2>
            <div class="flex gap-2">
              <input class="input font-mono text-xs" readonly :value="share.result.url" @focus="$el.select()">
              <button type="button" class="btn" @click="$store.cv.copy(share.result.url)">Copy</button>
            </div>
            <p class="text-sm text-stone-500">Valid until the start of <span x-text="share.result.expires"></span>.</p>
            <div class="flex justify-end gap-2">
              <a class="btn" :href="share.result.url" target="_blank" rel="noopener">Open</a>
              <button type="button" class="btn btn-primary" @click="share.open = false">Done</button>
            </div>
          </div>
        </template>
      </form>
    </div>
  </div>
{{ end }}
